name: selftest

on: [push, pull_request]

jobs:
  grader-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pytest
      - run: grading/selftest/run_selftest.sh
